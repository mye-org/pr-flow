name: pr-flow Sync

on:
  issues:
    types: [closed, reopened, labeled, unlabeled]
  pull_request:
    types: [closed]

concurrency:
  group: fsm-sync
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  sync:
    uses: mingqianye/pr-flow/.github/workflows/reusable-sync.yml@v1
    with:
      issue_number: ${{ github.event.issue.number || 0 }}
      pr_number: ${{ github.event.pull_request.number || 0 }}
      pr_merged: ${{ github.event.pull_request.merged || false }}
