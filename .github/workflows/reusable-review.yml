name: Reusable Review Follow-up

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      pr_flow_ref:
        required: false
        type: string
        default: v1
    secrets:
      GEMINI_API_KEY:
        required: false

jobs:
  resolve_issue:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      issue_number: ${{ steps.resolve.outputs.issue_number }}
      head_ref: ${{ steps.resolve.outputs.head_ref }}
      base_ref: ${{ steps.resolve.outputs.base_ref }}
    steps:
      - name: Extract issue number from PR branch ai/issue-<N>
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_JSON=$(gh pr view "${{ inputs.pr_number }}" --repo "${{ github.repository }}" --json headRefName,baseRefName)
          HEAD_REF=$(echo "$PR_JSON" | jq -r '.headRefName')
          BASE_REF=$(echo "$PR_JSON" | jq -r '.baseRefName')
          ISSUE_NUM=$(echo "$HEAD_REF" | sed -n 's/^ai\/issue-\([0-9]\+\)$/\1/p')
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"
          echo "issue_number=$ISSUE_NUM" >> "$GITHUB_OUTPUT"

  execute:
    needs: resolve_issue
    if: needs.resolve_issue.outputs.issue_number != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve_issue.outputs.head_ref }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: mye-org/pr-flow
          ref: ${{ inputs.pr_flow_ref }}
          path: _pr_flow
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute review follow-up with zero write tokens
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BASE_REF: ${{ needs.resolve_issue.outputs.base_ref }}
        run: |
          CONFIG_PATH="pr-flow.config.yml"
          if git fetch origin "$BASE_REF" 2>/dev/null && \
             git show "origin/$BASE_REF:pr-flow.config.yml" > /tmp/pr-flow.config.yml 2>/dev/null; then
            CONFIG_PATH="/tmp/pr-flow.config.yml"
          fi
          node _pr_flow/dist/cli.cjs execute \
            --issue "${{ needs.resolve_issue.outputs.issue_number }}" \
            --pr "${{ inputs.pr_number }}" \
            --config "$CONFIG_PATH" \
            --output-dir pr-flow-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-flow-review-${{ inputs.pr_number }}
          path: pr-flow-out/

  finalize:
    needs: [resolve_issue, execute]
    if: always() && needs.resolve_issue.outputs.issue_number != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: mye-org/pr-flow
          ref: ${{ inputs.pr_flow_ref }}
          path: _pr_flow
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: pr-flow-review-${{ inputs.pr_number }}
          path: pr-flow-out/
      - name: Ensure fallback result exists if execute crashed before artifact upload
        run: |
          mkdir -p pr-flow-out
          if [ ! -f pr-flow-out/result.json ]; then
            cat <<'EOF' > pr-flow-out/result.json
          {"status":"failed","summary":"Review execute job terminated before producing result.json.","reason":"The execute job failed or was cancelled before uploading pr-flow-out/result.json. Inspect workflow logs for details.","testsRun":false}
          EOF
          fi
          if [ ! -f pr-flow-out/changes.patch ]; then
            : > pr-flow-out/changes.patch
          fi
      - name: Append review fix commit to PR branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node _pr_flow/dist/cli.cjs finalize \
            --issue "${{ needs.resolve_issue.outputs.issue_number }}" \
            --pr "${{ inputs.pr_number }}" \
            --result pr-flow-out/result.json \
            --patch pr-flow-out/changes.patch
