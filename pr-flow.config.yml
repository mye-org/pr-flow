version: 1
wipLimit: 4
baseBranch: main

workspace:
  setupCommand: "npm ci"
  verifyCommand: "npm run verify"

agent:
  provider: gemini
  model: gemini-3.8-flash
  fallbackModels:
    - gemini-3-flash-preview
    - gemini-3.5-flash-lite
  maxRetries: 3
  timeoutMinutes: 20

triggers:
  reviewMode: changes_requested
  autoPickup: true
